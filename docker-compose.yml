# Local infrastructure for the API and worker.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: handiwork
      POSTGRES_PASSWORD: handiwork
      POSTGRES_DB: handiwork
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7
    ports: ["6379:6379"]
volumes:
  pgdata:
