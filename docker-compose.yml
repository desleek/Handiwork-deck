# Local infrastructure for development: PostgreSQL + Redis (BullMQ).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: handiwork
      POSTGRES_PASSWORD: handiwork
      POSTGRES_DB: handiwork
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
volumes:
  pgdata:
